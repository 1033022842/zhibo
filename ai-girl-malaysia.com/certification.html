<!doctype html>
<html lang="en">
<head>
		<link rel="icon" type="image/png" href="./sugus-favicon-v3.png">
		<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v3.png">
		<meta name="apple-mobile-web-app-title" content="Sugus.ai">
	    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sugus.ai: AI Girlfriend App | Chat, Voice, Images & Live Streams</title>
<style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0c0e18;color:#fff;min-height:100vh}
        .container{max-width:480px;margin:0 auto;padding:20px}
        .top-bar{display:flex;align-items:center;gap:12px;padding:16px 0;margin-bottom:24px}
        .back-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:transparent;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        h1{font-size:20px;font-weight:700}
        .status-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px;text-align:center;margin-bottom:20px}
        .status-icon{font-size:48px;margin-bottom:16px}
        .status-title{font-size:18px;font-weight:700;margin-bottom:8px}
        .status-desc{font-size:14px;color:rgba(255,255,255,.5);line-height:1.6}
        .passed .status-title{color:#00d4aa}
        .pending .status-title{color:#f59e0b}
        .rejected .status-title{color:#ff2d55}
        .form-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px}
        .form-title{font-size:16px;font-weight:600;margin-bottom:20px;text-align:center}
        .field{margin-bottom:18px}
        .field label{display:block;font-size:13px;color:rgba(255,255,255,.5);margin-bottom:6px}
        .field input[type=text],.field input[type=email],.field input[type=tel],.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.04);color:#fff;font-size:15px;outline:none}
        .field input:focus,.field select:focus,.field textarea:focus{border-color:#f59e0b}
        .field select{appearance:none;-webkit-appearance:none;cursor:pointer}
        .field select option{background:#1a1d2e;color:#fff}
        .field textarea{resize:vertical;min-height:80px}
        .upload-zone{width:100%;min-height:100px;border:2px dashed rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:border-color .2s}
        .upload-zone:hover{border-color:rgba(255,255,255,.3)}
        .upload-zone img{width:100%;max-height:200px;object-fit:contain;background:rgba(0,0,0,.3)}
        .upload-placeholder{display:flex;flex-direction:column;align-items:center;color:rgba(255,255,255,.3);gap:6px;font-size:13px;padding:16px}
        .btn-submit{width:100%;padding:14px;border:none;border-radius:24px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#f59e0b,#d97706);cursor:pointer;margin-top:12px;transition:opacity .2s}
        .btn-submit:disabled{opacity:.5;cursor:not-allowed}
        .btn-retry{width:100%;padding:12px;border-radius:24px;font-size:15px;font-weight:600;color:#fff;background:#ff2d55;border:none;cursor:pointer;margin-top:12px}
        .loading{display:flex;justify-content:center;padding:60px 0}
        .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.1);border-top-color:#f59e0b;border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        /* Toast & Modal */
        .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:14px 28px;border-radius:10px;font-size:14px;font-weight:600;z-index:999;animation:toastIn .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.4);display:none}
        .toast-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
        .toast-error{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
        .toast-warn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
        @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:998;align-items:center;justify-content:center;animation:fadeIn .2s ease}
        .modal-overlay.show{display:flex}
        .modal-box{background:#1a1d2e;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px 24px 24px;width:360px;max-width:92vw;text-align:center;animation:modalPop .3s ease}
        @keyframes modalPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .modal-icon{font-size:52px;margin-bottom:16px;line-height:1}
        .modal-title{font-size:17px;font-weight:700;margin-bottom:8px;color:#fff}
        .modal-desc{font-size:13px;color:rgba(255,255,255,.5);line-height:1.6;margin-bottom:20px}
        .modal-btn{display:inline-block;padding:10px 36px;border-radius:24px;font-size:14px;font-weight:700;cursor:pointer;border:none;color:#fff;background:linear-gradient(135deg,#f59e0b,#d97706);transition:opacity .2s}
        .modal-btn:hover{opacity:.85}
        .modal-btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626)}
        .modal-btn-success{background:linear-gradient(135deg,#10b981,#059669)}
    </style>
    <meta property="og:image" content="https://www.sugus.ai/ai/assets/brand/share_card.png">
    <meta property="og:title" content="Sugus.ai: AI Girlfriend App | Chat, Voice, Images & Live Streams">
    <meta name="description" content="Create your own AI girlfriend or chat instantly with realistic AI characters. Enjoy uncensored chats, voice calls, custom image generation, live streams and private short dramas — all in a safe, private and secure space with discreet billing.">
    <meta property="og:description" content="Create your own AI girlfriend or chat instantly with realistic AI characters. Enjoy uncensored chats, voice calls, custom image generation, live streams and private short dramas — all in a safe, private and secure space with discreet billing.">
</head>
<body>
<div class="container">
    <div class="top-bar">
        <button class="back-btn" onclick="history.back()">&#8592;</button>
        <h1>Merchant Verification</h1>
    </div>
    <div id="content">
        <div class="loading"><div class="spinner"></div></div>
    </div>
</div>

<div id="toast" class="toast"></div>
<div id="modal" class="modal-overlay" onclick="if(event.target===this)this.classList.remove('show')">
    <div class="modal-box">
        <div class="modal-icon" id="modalIcon"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-desc" id="modalDesc"></div>
        <button class="modal-btn" id="modalBtn" onclick="document.getElementById('modal').classList.remove('show')"></button>
    </div>
</div>

<script>
(function(){
    var token = localStorage.getItem('live_access_token')
    var base = '/api/v1/merchant'

    // Toast 通知
    var toastTimer
    function showToast(msg, type) {
        var t = document.getElementById('toast')
        t.textContent = msg
        t.className = 'toast toast-' + (type || 'success')
        t.style.display = 'block'
        clearTimeout(toastTimer)
        toastTimer = setTimeout(function(){ t.style.display = 'none' }, 2000)
    }
    // Modal 弹窗
    function showModal(icon, title, desc, btnText, btnClass, callback) {
        document.getElementById('modalIcon').innerHTML = icon
        document.getElementById('modalTitle').innerHTML = title
        document.getElementById('modalDesc').innerHTML = desc || ''
        var btn = document.getElementById('modalBtn')
        btn.textContent = btnText || 'OK'
        btn.className = 'modal-btn ' + (btnClass || '')
        btn.onclick = function(){
            document.getElementById('modal').classList.remove('show')
            if (callback) callback()
        }
        document.getElementById('modal').classList.add('show')
    }

    if (!token) {
        location.href = './Login.html'
        return
    }

    // 加载认证状态
    function loadStatus() {
        fetch(base + '/status', {
            headers: { 'Authorization': 'Bearer ' + token }
        }).then(function(r){ return r.json() }).then(function(d){
            if (d.code && d.code !== '00000') {
                document.getElementById('content').innerHTML = '<div class="status-card"><p class="status-desc">Session expired</p><button class="btn-submit" onclick="location.href=\'./Login.html\'">Log In</button></div>'
                return
            }
            var status = d.data ? d.data.cert_status : -1
            if (status === 1) {
                renderPassed()
            } else if (status === 0) {
                renderPending()
            } else if (status === 2) {
                renderRejected()
            } else {
                renderForm()
            }
        }).catch(function(){
            document.getElementById('content').innerHTML = '<div class="status-card"><p class="status-desc">Network error</p><button class="btn-submit" onclick="loadStatus()">Retry</button></div>'
        })
    }

    function renderPassed() {
        document.getElementById('content').innerHTML =
            '<div class="status-card passed"><div class="status-icon">&#10003;</div><div class="status-title">Verification Approved</div><div class="status-desc">You can now create AI characters</div><button class="btn-submit" onclick="location.href=\'./charactersIndex.html\'">Back</button></div>'
    }

    function renderPending() {
        document.getElementById('content').innerHTML =
            '<div class="status-card pending"><div class="status-icon">&#9201;</div><div class="status-title">Under Review</div><div class="status-desc">Your verification is under review. Please wait patiently.</div><button class="btn-submit" onclick="location.href=\'./charactersIndex.html\'">Back</button></div>'
    }

    function renderRejected() {
        document.getElementById('content').innerHTML =
            '<div class="status-card rejected"><div class="status-icon">&#10007;</div><div class="status-title">Verification Rejected</div><div class="status-desc">You can edit your information and submit again</div><button class="btn-retry" onclick="renderForm()">Submit Again</button></div>'
    }

    function renderForm() {
        // 先获取经营类目
        var shopTypesLoaded = false
        var shopTypeOptions = ''
        fetch(base + '/shop-types', {
            headers: { 'Authorization': 'Bearer ' + token }
        }).then(function(r){ return r.json() }).then(function(d){
            if (d.code === '00000' && d.data) {
                shopTypeOptions = d.data.map(function(t){ return '<option value="'+t.value+'">'+t.label+'</option>' }).join('')
            }
            shopTypesLoaded = true
            buildForm()
        }).catch(function(){
            shopTypesLoaded = true
            buildForm()
        })

        function buildForm() {
            document.getElementById('content').innerHTML =
                '<div class="form-card">' +
                '<div class="form-title">Submit Verification Information</div>' +
                '<div class="field"><label>Full Name *</label><input type="text" id="realName" placeholder="Enter your full name" maxlength="50"></div>' +
                '<div class="field"><label>ID Number *</label><input type="text" id="idCardNo" placeholder="Enter your ID number" maxlength="18"></div>' +
                '<div class="field"><label>Phone Number *</label><input type="tel" id="phone" placeholder="Enter your phone number" maxlength="20"></div>' +
                '<div class="field"><label>Email *</label><input type="email" id="certEmail" placeholder="Enter your email" maxlength="255"></div>' +
                '<div class="field"><label>Store Name *</label><input type="text" id="shopName" placeholder="Enter your store name" maxlength="100"></div>' +
                '<div class="field"><label>Business Category *</label><select id="shopType">' +
                '<option value="">'+ (shopTypesLoaded ? 'Failed to load, please refresh' : 'Loading...') +'</option>' +
                shopTypeOptions +
                '</select></div>' +
                '<div class="field"><label>Store Description</label><textarea id="shopDesc" placeholder="Briefly describe your store (optional)" maxlength="500"></textarea></div>' +
                '<div class="field"><label>ID Card Front *</label><div class="upload-zone" id="frontUpload"><div class="upload-placeholder"><span style="font-size:28px">&#128247;</span><span>Click to upload</span></div></div><input type="file" id="frontInput" accept="image/*" style="display:none"></div>' +
                '<div class="field"><label>ID Card Back *</label><div class="upload-zone" id="backUpload"><div class="upload-placeholder"><span style="font-size:28px">&#128247;</span><span>Click to upload</span></div></div><input type="file" id="backInput" accept="image/*" style="display:none"></div>' +
                '<div class="field"><label>Business License *</label><div class="upload-zone" id="licenseUpload"><div class="upload-placeholder"><span style="font-size:28px">&#128196;</span><span>Click to upload</span></div></div><input type="file" id="licenseInput" accept="image/*" style="display:none"></div>' +
                '<button class="btn-submit" id="btnSubmit" onclick="doSubmit()">Submit Verification</button>' +
                '</div>'

            bindUploads()
        }
    }

    function bindUploads() {
        var frontUrl = '', backUrl = '', licenseUrl = ''
        var front = document.getElementById('frontUpload')
        var back = document.getElementById('backUpload')
        var license = document.getElementById('licenseUpload')
        var frontInput = document.getElementById('frontInput')
        var backInput = document.getElementById('backInput')
        var licenseInput = document.getElementById('licenseInput')

        if (front) { front.onclick = function(){ frontInput.click() } }
        if (back) { back.onclick = function(){ backInput.click() } }
        if (license) { license.onclick = function(){ licenseInput.click() } }

        if (frontInput) { frontInput.onchange = function(e){ uploadFile(e.target.files[0], front, function(url){ frontUrl = url }) } }
        if (backInput) { backInput.onchange = function(e){ uploadFile(e.target.files[0], back, function(url){ backUrl = url }) } }
        if (licenseInput) { licenseInput.onchange = function(e){ uploadFile(e.target.files[0], license, function(url){ licenseUrl = url }) } }

        window.doSubmit = function(){
            var realName = document.getElementById('realName').value.trim()
            var idCardNo = document.getElementById('idCardNo').value.trim()
            var phone = document.getElementById('phone').value.trim()
            var email = document.getElementById('certEmail').value.trim()
            var shopName = document.getElementById('shopName').value.trim()
            var shopType = document.getElementById('shopType').value
            var shopDesc = document.getElementById('shopDesc').value.trim()
            var btn = document.getElementById('btnSubmit')

            if (!realName) { showToast('Please enter your full name', 'error'); return }
            if (!idCardNo) { showToast('Please enter your ID number', 'error'); return }
            if (!/^[a-zA-Z0-9]{15,18}$/.test(idCardNo)) { showToast('Invalid ID number format', 'error'); return }
            if (!phone) { showToast('Please enter your phone number', 'error'); return }
            if (!/^1[3-9]\d{9}$/.test(phone)) { showToast('Invalid phone number format', 'error'); return }
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('Please enter a valid email', 'error'); return }
            if (!shopName) { showToast('Please enter your store name', 'error'); return }
            if (!shopType) { showToast('Please select a business category', 'error'); return }
            if (!frontUrl) { showToast('Please upload the front of your ID card', 'error'); return }
            if (!backUrl) { showToast('Please upload the back of your ID card', 'error'); return }
            if (!licenseUrl) { showToast('Please upload your business license', 'error'); return }

            btn.disabled = true
            btn.textContent = 'Submitting...'
            var r = new XMLHttpRequest()
            r.open('POST', base + '/submit')
            r.setRequestHeader('Authorization', 'Bearer ' + token)
            r.setRequestHeader('Content-Type', 'application/json')
            r.onload = function(){
                btn.disabled = false
                btn.textContent = 'Submit Verification'
                try {
                    var d = JSON.parse(r.responseText)
                    if (d.code === '00000' || d.code === 0) {
                        showModal('&#10003;', 'Submitted Successfully', 'Your verification request has been submitted. Please wait for review.', 'Got it', 'modal-btn-success', function(){ loadStatus() })
                    } else {
                        showToast(d.msg || 'Submission failed', 'error')
                    }
                } catch(e) {
                    showToast('Submission failed', 'error')
                }
            }
            r.onerror = function(){
                btn.disabled = false
                btn.textContent = 'Submit Verification'
                showToast('Network error, please try again', 'error')
            }
            r.send(JSON.stringify({
                real_name: realName,
                id_card_no: idCardNo,
                phone: phone,
                email: email,
                shop_name: shopName,
                shop_type: shopType,
                shop_description: shopDesc,
                id_card_front: frontUrl,
                id_card_back: backUrl,
                business_license: licenseUrl
            }))
        }
    }

    function uploadFile(file, zone, cb) {
        var fd = new FormData()
        fd.append('file', file)
        var r = new XMLHttpRequest()
        r.open('POST', base + '/upload')
        r.setRequestHeader('Authorization', 'Bearer ' + token)
        r.onload = function(){
            if (r.status === 200) {
                var d = JSON.parse(r.responseText)
                if (d.code === '00000' && d.data && d.data.url) {
                    zone.innerHTML = '<img src="' + d.data.url + '">'
                    cb(d.data.url)
                } else {
                    showToast('Upload failed', 'error')
                }
            }
        }
        r.send(fd)
    }

    loadStatus()
})()
</script>
	<script src="./js/promo-popup.js?v=20261018b"></script>
	<script src="./js/creator-guide.js?v=20261018b"></script>
	<script src="./js/tracking.js?v=20261018a"></script>
	<script src="./js/pending-order.js?v=20261018b"></script>
</body>
</html>
