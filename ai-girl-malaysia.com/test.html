    <meta property="og:description" content="Create your own AI girlfriend or chat instantly with realistic AI characters. Enjoy uncensored chats, voice calls, custom image generation, live streams and private short dramas — all in a safe, private and secure space with discreet billing.">

<script src="./_shared/jquery-3.6.0.min.js"></script>
<body>
    <h2>Submit Your Information</h2>
    
    <!-- 图片上传 -->
    <form id="imageUploadForm">
        <label for="image">Upload your image:</label>
        <input type="file" id="image" name="image" accept="image/*" required onchange="uploadImage(event)">
        <br><br>
        <!-- 图片回显 -->
        <img id="imagePreview" src="#" alt="Image Preview" style="display: none; width: 200px; height: auto;">
        <br><br>
    </form>

    <!-- 其他字段填写 -->
    <form id="infoForm" action="/submit" method="POST">
        <!-- 身高填写 -->
        <label for="height">Enter your height (cm):</label>
        <input type="number" id="height" name="height" placeholder="e.g., 170" min="50" max="250" required>
        <br><br>

        <!-- 体重填写 -->
        <label for="weight">Enter your weight (kg):</label>
        <input type="number" id="weight" name="weight" placeholder="e.g., 70" min="20" max="300" required>
        <br><br>

        <!-- 隐藏字段保存图片上传后的 URL -->
        <input type="hidden" id="uploadedImageUrl" name="uploadedImageUrl">

        <!-- 提交按钮 -->
        <button type="submit" id="submitButton" disabled>Submit</button>
    </form>

    <script>
        var base = 'http://154.19.70.25:39200'
        var token = localStorage.getItem('token')
        function uploadImage(event) {
            var file = event.target.files[0];     
            var image = document.getElementById('imagePreview');
            var submitButton = document.getElementById('submitButton');
            
            // 使用 fetch API 上传图片到单独接�?
            var headers = {}
            if(token) {
                headers = {
                token
                }
            }
            const form = new FormData();
            form.append("file",file);
            const settings = {
                "async": true,
                "crossDomain": true,
                "url":  base + "/index/ajax/upload",
                "method": "POST",
                "headers": headers,
                "processData": false,
                "contentType": false,
                "mimeType": "multipart/form-data",
                "data": form
            };

            $.ajax(settings).done(function (response) {
                if(typeof(response) === 'string') {
                    response = JSON.parse(response)
                }
                var res = response
                if(res.code === 1) {
                    debugger
                    var data = res.data
                    image.src = data.fullurl;
                    image.style.display = 'block';  // 显示预览图片

                    // 将上传后的图�?URL 填入隐藏字段�?
                    document.getElementById('uploadedImageUrl').value = data.imageUrl;

                    // 启用提交按钮
                    submitButton.disabled = false;
                } else {
                    alert(res.msg)
                }
            }).catch(error => console.error(error))
        }
    </script>
	<script src="./js/promo-popup.js?v=20261008a"></script>
	<script src="./js/creator-guide.js?v=20261011a"></script>
	<script src="./js/tracking.js?v=20261018a"></script>
</body>
</html>
