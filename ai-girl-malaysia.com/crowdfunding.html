    <style>
        @media only screen and (max-width: 768px){ .pc-nav{ display:none; } }
        .login-pf{ display:none; }
        #user-login{ display:none; }

        /* ===== Creation mode switch ===== */
        .cf-tabs{display:flex;gap:6px;background:#1d1d1d;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:6px;margin-bottom:24px}
        .cf-tab{flex:1;text-align:center;padding:12px;border-radius:9px;font-size:14px;font-weight:700;color:rgba(255,255,255,.55);cursor:pointer;border:none;background:transparent;font-family:inherit;transition:all .15s}
        .cf-tab:hover{color:rgba(255,255,255,.85)}
        .cf-tab.on{background:linear-gradient(268deg,#fc768a -14.8%,#e65073 102.08%);color:#fff}

        /* ===== Earnings banner ===== */
        .cf-earn{display:flex;align-items:center;gap:12px;background:rgba(231,82,117,.08);border:1px solid rgba(231,82,117,.28);border-radius:14px;padding:14px 16px;margin-bottom:20px}
        .cf-earn-ic{font-size:22px;line-height:1;flex-shrink:0}
        .cf-earn-txt{flex:1;min-width:0}
        .cf-earn-txt .t{color:#fff;font-size:13px;font-weight:700;margin-bottom:2px}
        .cf-earn-txt .d{color:rgba(255,255,255,.55);font-size:12px;line-height:1.6}
        .cf-earn-btn{flex-shrink:0;padding:9px 18px;border-radius:9999px;background:linear-gradient(268deg,#fc768a,#e65073);color:#fff;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
        @media (max-width:520px){ .cf-earn{align-items:flex-start} }

        .cf-form{background:#262626;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:28px}
        .cf-field{margin-bottom:20px}
        .cf-label{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);margin-bottom:8px}
        .cf-label .req{color:#E75275}
        .cf-input{width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#1d1d1d;color:#fff;font-size:14px;outline:none;font-family:inherit;box-sizing:border-box}
        .cf-input:focus{border-color:#E75275}
        .cf-input::placeholder{color:rgba(255,255,255,.28)}
        select.cf-input{appearance:none;-webkit-appearance:none}
        select.cf-input option{background:#1d1d1d;color:#fff}
        .cf-date{cursor:pointer}
        .cf-date::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.75}
        textarea.cf-input{resize:vertical;min-height:90px}
        .cf-grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
        @media (max-width:520px){ .cf-grid2{grid-template-columns:1fr} }
        .cf-hint{font-size:11px;color:rgba(255,255,255,.35);margin-top:6px}
        .cf-counter{font-size:11px;color:rgba(255,255,255,.35);margin-top:5px;text-align:right}
        .cf-counter.ok{color:#34d399}
        .cf-counter.bad{color:#f59e0b}
        .cf-section{font-size:12px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.5px;text-transform:uppercase;margin:26px 0 14px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)}
        .cf-section:first-child{border-top:none;padding-top:0;margin-top:0}
        .cf-chips{display:flex;flex-wrap:wrap;gap:8px}
        .cf-chip{padding:9px 16px;border-radius:9999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:rgba(255,255,255,.7);font-size:13px;font-family:inherit;cursor:pointer;user-select:none;transition:all .15s}
        .cf-chip:hover{border-color:rgba(255,255,255,.3)}
        .cf-chip.on{border-color:#E75275;background:rgba(231,82,117,.16);color:#F97187}
        .cf-chips.wide .cf-chip{flex:1;text-align:center}
        .cf-upload{width:100%;aspect-ratio:16/9;border:2px dashed rgba(255,255,255,.18);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:border-color .2s}
        .cf-upload:hover{border-color:#E75275}
        .cf-upload img{width:100%;height:100%;object-fit:cover}
        .cf-upload-ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:rgba(255,255,255,.35);font-size:13px}
        .cf-amount{display:flex;align-items:center;gap:8px}
        .cf-amount .cf-input{flex:1}
        .cf-amount .unit{font-size:15px;color:rgba(255,255,255,.4)}
        .cf-agreement{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:16px;font-size:12px;color:rgba(255,255,255,.45);line-height:1.8;margin:22px 0 18px}
        .cf-agreement ul{padding-left:16px}
        .cf-submit{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(268deg,#fc768a -14.8%,#e65073 102.08%);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .15s}
        .cf-submit:disabled{opacity:.5;cursor:not-allowed}

        /* ===== Asset upload (create on my own) ===== */
        .cf-addbtn{width:100%;padding:14px;border:1px dashed rgba(255,255,255,.2);border-radius:12px;color:rgba(255,255,255,.6);font-size:13px;font-family:inherit;background:transparent;cursor:pointer;transition:all .15s}
        .cf-addbtn:hover{border-color:#E75275;color:#F97187}
        .cf-materials{display:flex;flex-direction:column;gap:10px;margin-top:12px}
        .cf-mat{display:flex;align-items:center;gap:12px;background:#1d1d1d;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px}
        .cf-mat .nm{flex:1;font-size:13px;color:rgba(255,255,255,.75);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .cf-mat .rm{color:#f59e0b;font-size:12px;background:none;border:none;cursor:pointer;font-family:inherit}

        .cf-center{display:flex;justify-content:center;padding:60px 0}
        .cf-spin{width:32px;height:32px;border:3px solid rgba(255,255,255,.1);border-top-color:#E75275;border-radius:50%;animation:cfr .8s linear infinite}
        @keyframes cfr{to{transform:rotate(360deg)}}
        .cf-status{background:#262626;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:32px;text-align:center}
        .cf-status .ico{font-size:48px;margin-bottom:14px}
        .cf-status .ttl{font-size:18px;font-weight:700;margin-bottom:8px}
        .cf-status .desc{font-size:14px;color:rgba(255,255,255,.5);line-height:1.6;margin-bottom:18px}
        .cf-warn .ttl{color:#f59e0b}
        .cf-pass .ttl{color:#F97187}
        .cf-status .btn-line{display:flex;justify-content:center;gap:10px}
        .cf-btn-o{display:inline-flex;align-items:center;justify-content:center;padding:11px 26px;border-radius:9999px;border:1px solid #E75275;color:#E75275;background:transparent;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
        .cf-btn-s{display:inline-flex;align-items:center;justify-content:center;padding:11px 26px;border-radius:9999px;border:none;color:#fff;background:linear-gradient(268deg,#fc768a,#e65073);font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}

        .cf-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:12px 26px;border-radius:10px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,.4);display:none}
        .cf-toast-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
        .cf-toast-error{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
        .cf-toast-warn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}

        .cf-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:16px}
        .cf-modal.show{display:flex}
        .cf-modal-box{background:#1b1b1b;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:30px 26px;width:380px;max-width:100%;text-align:center}
        .cf-modal-box .ico{font-size:52px;margin-bottom:14px;line-height:1}
        .cf-modal-box .ttl{font-size:18px;font-weight:700;margin-bottom:8px}
        .cf-modal-box .desc{font-size:13px;color:rgba(255,255,255,.5);line-height:1.6;margin-bottom:20px}
        .cf-modal-box .mbtn{display:inline-block;padding:11px 40px;border-radius:9999px;border:none;color:#fff;background:linear-gradient(268deg,#fc768a,#e65073);font-size:14px;font-weight:700;cursor:pointer}

        /* ===== Earning guide popup is provided site-wide by js/creator-guide.js ===== */
    </style>

<body class="bg-main pages" id="app" data-controller="main" data-main-is-sidebar-opened-value="true">

<div class="main-content-container">
    <main class="ml-0 lg:ml-[100px] mt-16 lg:mb-0 mb-[76px] h-full">
        <div class="mx-auto max-w-3xl px-4 sm:px-6 lg:px-8 pt-6 pb-20">

            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-white text-2xl font-bold">Creator Center</h1>
                    <p class="text-[#A1A1A1] text-[13px] mt-1">Create characters, publish your work and earn revenue</p>

                    <a href="./my-crowdfunding.html#creations" class="text-[#E75275] text-sm font-semibold no-underline">My Creations &#8594;</a>
                </div>

            <div class="cf-earn">

                    <div class="d">Revenue from your published characters works the same as live streaming — split by the backend-configured ratio (currently 50% creator : 50% platform). Creator payouts are after tax.</div>
                </div>
                <a href="./Withdrawal.html" class="cf-earn-btn">Withdraw</a>

            <div class="cf-tabs" id="tabs">
                <button type="button" class="cf-tab on" data-tab="independent" onclick="switchTab('independent')">Create on my own</button>
                <button type="button" class="cf-tab" data-tab="crowdfunding" onclick="switchTab('crowdfunding')">Crowdfunding</button>

<div class="cf-modal" id="modal">
    <div class="cf-modal-box">
        <div class="ico" id="modalIcon"></div>
        <div class="ttl" id="modalTitle"></div>
        <div class="desc" id="modalDesc"></div>
        <button class="mbtn" id="modalBtn">OK</button>

<script>
(function() {
    var token = localStorage.getItem('live_access_token')
    var base = '/api/v1'
    // Submit endpoint for "create on my own" (pending backend confirmation; change here if it changes)
    var INDEPENDENT_API = base + '/creator/independent'
    var currentTab = 'independent'
    // Uploaded assets: { name, url }
    var materials = []

    function showToast(msg, type) {
        var el = document.getElementById('toast')
        el.textContent = msg
        el.className = 'cf-toast cf-toast-' + (type || 'success')
        el.style.display = 'block'
        setTimeout(function(){ el.style.display = 'none' }, 2500)
    }

    function showModal(icon, title, desc, btnText, callback) {
        document.getElementById('modalIcon').textContent = icon
        document.getElementById('modalTitle').textContent = title
        document.getElementById('modalDesc').textContent = desc
        var btn = document.getElementById('modalBtn')
        btn.textContent = btnText || 'OK'
        btn.onclick = function(){
            document.getElementById('modal').classList.remove('show')
            if (callback) callback()
        }
        document.getElementById('modal').classList.add('show')
    }

    if (!token) { location.href = './Login.html'; return }

    // ===== Earning guide popup (provided site-wide by js/creator-guide.js) =====
    var openGuideBtn = document.getElementById('openGuide')
    if (openGuideBtn) openGuideBtn.onclick = function(){ window.CreatorGuide && window.CreatorGuide.open() }

    // ===== Creation mode switch =====
    window.switchTab = function(tab) {
        if (tab !== 'independent' && tab !== 'crowdfunding') tab = 'independent'
        currentTab = tab
        var tabs = document.getElementById('tabs').getElementsByClassName('cf-tab')
        for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.toggle('on', tabs[i].getAttribute('data-tab') === tab)
        }
        if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab)
        if (tab === 'crowdfunding') {
            document.getElementById('content').innerHTML = '<div class="cf-center"><div class="cf-spin"></div></div>'
            loadCrowdfundingStatus()
        } else {
            renderIndependentForm()
        }
    }

    if (location.hash === '#crowdfunding') { window.switchTab('crowdfunding') }
    else { window.switchTab('independent') }

    // ===================================================================
    // Create on my own
    // ===================================================================
    function renderIndependentForm() {
        materials = []
        document.getElementById('content').innerHTML =
            '<div class="cf-form">' +
            '<div class="cf-section">Basic Info</div>' +

            '<div class="cf-field"><label class="cf-label">Cover image</label>' +
            '<div class="cf-upload" id="coverUpload" onclick="document.getElementById(\'coverInput\').click()">' +
            '<div class="cf-upload-ph"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Click to upload cover</span></div>' +
            '</div><input type="file" id="coverInput" accept="image/*" style="display:none" onchange="uploadCover(this)" /></div>' +
            '<input type="hidden" id="coverUrl" />' +

            '<div class="cf-field"><label class="cf-label">Character name <span class="req">*</span></label><input type="text" class="cf-input" id="personaName" placeholder="Give your character a name" maxlength="50" /></div>' +
            '<div class="cf-field"><label class="cf-label">Character description <span class="req">*</span></label>' +
            '<textarea class="cf-input" id="description" rows="9" maxlength="5000" oninput="onDescInput()" placeholder="Describe the character: backstory, personality, appearance and outfit, way of speaking, daily interactions, suitable play style and audience..."></textarea>' +
            '<div class="cf-counter" id="descCounter">0 / 200 characters</div></div>' +

            '<div class="cf-section">Character Settings</div>' +
            '<div class="cf-field"><label class="cf-label">Tags <span class="req">*</span></label>' +
            '<input type="text" class="cf-input" id="tags" placeholder="Comma separated, e.g. Mature,Sweet,Aloof,Clingy" />' +
            '<div class="cf-hint">Up to 10 tags, comma separated</div></div>' +

            '<div class="cf-grid2">' +
            '<div class="cf-field"><label class="cf-label">Style <span class="req">*</span></label><select class="cf-input" id="style">' +
            '<option value="">Choose a style</option><option value="realistic">Realistic</option><option value="anime">Anime</option><option value="3d">3D</option><option value="cyberpunk">Cyberpunk</option><option value="chinese">Chinese</option><option value="korean">Korean</option><option value="western">Western</option>' +
            '</select></div>' +
            '<div class="cf-field"><label class="cf-label">Gender</label><select class="cf-input" id="gender">' +
            '<option value="">Any</option><option value="female">Female</option><option value="male">Male</option><option value="other">Other</option>' +
            '</select></div></div>' +

            '<div class="cf-grid2">' +
            '<div class="cf-field"><label class="cf-label">Age range</label><select class="cf-input" id="ageRange">' +
            '<option value="">Any</option><option value="18-22">18-22</option><option value="23-27">23-27</option><option value="28-35">28-35</option><option value="36-45">36-45</option><option value="45+">45+</option>' +
            '</select></div>' +
            '<div class="cf-field"><label class="cf-label">Language</label><select class="cf-input" id="language">' +
            '<option value="">Any</option><option value="zh-CN">Chinese</option><option value="en-US">English</option><option value="ja-JP">Japanese</option><option value="ms-MY">Malay</option><option value="multi">Multi-language</option>' +
            '</select></div></div>' +

            '<div class="cf-field"><label class="cf-label">Personality</label><input type="text" class="cf-input" id="personality" placeholder="Comma separated, e.g. Gentle,Humorous,Tsundere" /></div>' +
            '<div class="cf-field"><label class="cf-label">Voice style</label><select class="cf-input" id="voiceStyle">' +
            '<option value="">Any</option><option value="sweet">Sweet</option><option value="mature">Mature</option><option value="magnetic">Magnetic</option><option value="loli">Loli</option><option value="cold">Cold</option><option value="gentle">Gentle</option><option value="none">No voice</option>' +
            '</select></div>' +

            '<div class="cf-section">Assets</div>' +
            '<div class="cf-field"><label class="cf-label">Character assets <span class="req">*</span></label>' +
            '<button type="button" class="cf-addbtn" onclick="document.getElementById(\'materialInput\').click()">+ Upload assets (portrait / voice / short video, multiple)</button>' +
            '<input type="file" id="materialInput" multiple accept="image/*,video/*,audio/*" style="display:none" onchange="uploadMaterials(this)" />' +
            '<div class="cf-materials" id="materialList"></div>' +
            '<div class="cf-hint">Submitted for platform review</div></div>' +

            '<div class="cf-section">Publish Settings</div>' +
            '<div class="cf-field"><label class="cf-label">Publish type <span class="req">*</span></label>' +
            '<div class="cf-chips wide" id="publishRow">' +
            '<button type="button" class="cf-chip" data-v="live" onclick="pickPublish(this)">Live streamer</button>' +
            '<button type="button" class="cf-chip" data-v="chat" onclick="pickPublish(this)">Chat companion</button>' +
            '<button type="button" class="cf-chip" data-v="drama" onclick="pickPublish(this)">Short drama</button>' +
            '</div><div class="cf-hint">Single choice</div></div>' +

            '<div class="cf-field"><label class="cf-label">18+ content <span class="req">*</span></label>' +
            '<div class="cf-chips wide" id="adultRow">' +
            '<button type="button" class="cf-chip on" data-v="0" onclick="pickAdult(this)">No &middot; All ages</button>' +
            '<button type="button" class="cf-chip" data-v="1" onclick="pickAdult(this)">Yes &middot; 18+</button>' +
            '</div><div class="cf-hint">18+ content is only shown to adult users</div></div>' +

            '<div class="cf-field"><label class="cf-label">Highlights</label><textarea class="cf-input" id="highlights" rows="3" maxlength="500" placeholder="One-line selling point or differentiator, can be multi-line"></textarea></div>' +
            '<div class="cf-field"><label class="cf-label">Reference link</label><input type="url" class="cf-input" id="referenceUrl" placeholder="https://... (optional, style reference / portfolio)" /></div>' +

            '<div class="cf-agreement"><p>By submitting you agree that:</p><ul><li>Character assets must comply with platform content rules</li><li>Submissions are reviewed by the platform before going live</li><li>Revenue after going live works the same as live streaming, split by the backend-configured ratio (currently 5:5)</li></ul></div>' +
            '<button class="cf-submit" id="submitBtn" onclick="doSubmitIndependent()">Submit for review</button>' +
            '</div>'

        onDescInput()
    }

    function onDescInput() {
        var el = document.getElementById('description')
        var counter = document.getElementById('descCounter')
        if (!el || !counter) return
        var len = el.value.trim().length
        counter.textContent = len + ' / 200 characters'
        counter.className = 'cf-counter' + (len >= 200 ? ' ok' : (len > 0 ? ' bad' : ''))
    }
    window.onDescInput = onDescInput

    window.pickPublish = function(btn) {
        var row = document.getElementById('publishRow')
        var chips = row.getElementsByClassName('cf-chip')
        for (var i = 0; i < chips.length; i++) chips[i].classList.remove('on')
        btn.classList.add('on')
    }

    window.pickAdult = function(btn) {
        var row = document.getElementById('adultRow')
        var chips = row.getElementsByClassName('cf-chip')
        for (var i = 0; i < chips.length; i++) chips[i].classList.remove('on')
        btn.classList.add('on')
    }

    function uploadFile(file, cb, onFail) {
        var fd = new FormData()
        fd.append('file', file)
        fetch(base + '/merchant/upload', { method: 'POST', body: fd, headers: { 'Authorization': 'Bearer ' + token } })
            .then(function(r){ return r.json() }).then(function(d){
                if (d.data && d.data.url) { cb(d.data.url) } else if (onFail) { onFail() }
            }).catch(function(){ if (onFail) onFail() })
    }

    window.uploadCover = function(input) {
        var file = input.files[0]
        if (!file) return
        var btn = document.getElementById('submitBtn')
        btn.disabled = true
        btn.textContent = 'Uploading cover...'
        uploadFile(file, function(url){
            btn.disabled = false
            btn.textContent = 'Submit for review'
            document.getElementById('coverUrl').value = url
            document.getElementById('coverUpload').innerHTML = '<img src="' + url + '" alt="cover" />'
        }, function(){
            btn.disabled = false
            btn.textContent = 'Submit for review'
            showToast('Upload failed', 'error')
        })
    }

    window.uploadMaterials = function(input) {
        var files = input.files
        if (!files || !files.length) return
        input.value = ''
        var pending = files.length
        for (var i = 0; i < files.length; i++) {
            (function(file){
                uploadFile(file, function(url){
                    materials.push({ name: file.name, url: url })
                    renderMaterials()
                    if (--pending === 0) showToast('Upload complete', 'success')
                }, function(){
                    if (--pending === 0) showToast('Some uploads failed', 'error')
                })
            })(files[i])
        }
    }

    window.removeMaterial = function(idx) {
        materials.splice(idx, 1)
        renderMaterials()
    }

    function renderMaterials() {
        var list = document.getElementById('materialList')
        if (!list) return
        var html = ''
        for (var i = 0; i < materials.length; i++) {
            html += '<div class="cf-mat"><span class="nm">' + materials[i].name + '</span>' +
                '<button type="button" class="rm" onclick="removeMaterial(' + i + ')">Remove</button></div>'
        }
        list.innerHTML = html
    }

    function splitList(v) {
        return String(v || '').replace(/，/g, ',').split(',').map(function(s){ return s.trim() }).filter(function(s){ return s !== '' })
    }

    window.doSubmitIndependent = function() {
        var personaName = document.getElementById('personaName').value.trim()
        var description = document.getElementById('description').value.trim()
        var tags = splitList(document.getElementById('tags').value)
        var style = document.getElementById('style').value
        var gender = document.getElementById('gender').value
        var ageRange = document.getElementById('ageRange').value
        var language = document.getElementById('language').value
        var personality = splitList(document.getElementById('personality').value)
        var voiceStyle = document.getElementById('voiceStyle').value
        var publishChip = document.querySelector('#publishRow .cf-chip.on')
        var adultChip = document.querySelector('#adultRow .cf-chip.on')
        var highlights = document.getElementById('highlights').value.trim()
        var referenceUrl = document.getElementById('referenceUrl').value.trim()
        var coverUrl = document.getElementById('coverUrl').value

        if (!personaName) { showToast('Please enter a character name', 'warn'); return }
        if (description.length < 200) { showToast('Description must be at least 200 characters (currently ' + description.length + ')', 'warn'); return }
        if (!tags.length) { showToast('Please add at least one tag', 'warn'); return }
        if (tags.length > 10) { showToast('Up to 10 tags', 'warn'); return }
        if (!style) { showToast('Please choose a style', 'warn'); return }
        if (!materials.length) { showToast('Please upload at least one asset', 'warn'); return }
        if (!publishChip) { showToast('Please select a publish type', 'warn'); return }
        if (!adultChip) { showToast('Please select whether it is 18+ content', 'warn'); return }
        if (referenceUrl && !/^https?:\/\//i.test(referenceUrl)) { showToast('Reference link must start with http(s)://', 'warn'); return }

        var btn = document.getElementById('submitBtn')
        btn.disabled = true
        btn.textContent = 'Submitting...'

        fetch(INDEPENDENT_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({
                persona_name: personaName, description: description,
                tags: tags.join(','), style: style, gender: gender, age_range: ageRange,
                language: language, personality: personality.join(','), voice_style: voiceStyle,
                publish_type: publishChip.getAttribute('data-v'),
                is_adult: adultChip.getAttribute('data-v'),
                highlights: highlights, reference_url: referenceUrl, cover_url: coverUrl,
                materials: materials
            })
        }).then(function(r){ return r.json() }).then(function(d){
            btn.disabled = false
            btn.textContent = 'Submit for review'
            if (d.code === '00000' || (d.data && d.data.id)) {
                showModal('\u2728', 'Submitted for review', 'Your character has been submitted. It will go live after platform review, and then start earning revenue.', 'View my creations', function(){
                    location.href = './my-crowdfunding.html#creations'
                })
            } else {
                showToast(d.msg || 'Submission failed', 'error')
            }
        }).catch(function(){
            btn.disabled = false
            btn.textContent = 'Submit for review'
            showToast('Network error, please try again later', 'error')
        })
    }

    // ===================================================================
    // Crowdfunding
    // ===================================================================
    function loadCrowdfundingStatus() {
        fetch(base + '/merchant/status', { headers: { 'Authorization': 'Bearer ' + token } })
            .then(function(r){ return r.json() }).then(function(d){
                if (d.code && d.code !== '00000') {
                    document.getElementById('content').innerHTML = '<div class="cf-status"><div class="desc">Session expired</div><a class="cf-btn-s" href="./Login.html">Log in</a></div>'
                    return
                }
                var status = d.data ? d.data.cert_status : -1
                if (status === 1) { renderCrowdfundingForm() } else { renderNeedCert() }
            }).catch(function(){
                document.getElementById('content').innerHTML = '<div class="cf-status cf-warn"><div class="ico">&#9888;</div><div class="ttl">Network error</div><div class="desc">Failed to load, please try again later</div><button class="cf-btn-o" onclick="loadCrowdfundingStatus()">Retry</button></div>'
            })
    }
    window.loadCrowdfundingStatus = loadCrowdfundingStatus

    function renderNeedCert() {
        document.getElementById('content').innerHTML =
            '<div class="cf-status cf-warn"><div class="ico">&#9888;</div><div class="ttl">Merchant verification required</div>' +
            '<div class="desc">You need merchant verification to start a crowdfunding project</div>' +
            '<div class="btn-line"><a class="cf-btn-s" href="./certification.html">Get verified</a>' +
            '<button class="cf-btn-o" onclick="switchTab(\'independent\')">Create on my own</button></div></div>'
    }

            '<div class="cf-field"><label class="cf-label">Target amount (tokens) <span class="req">*</span></label>' +

            '<div class="cf-hint">Set a reasonable target; the character is created once the goal is reached</div></div>' +
            '<div class="cf-field"><label class="cf-label">End time <span class="req">*</span></label><input type="datetime-local" class="cf-input cf-date" id="deadline" onclick="cfOpenPicker(this)" onfocus="cfOpenPicker(this)" /></div>' +

    window.toggleDeliver = function(btn) { btn.classList.toggle('on') }

    // Clicking anywhere on the field opens the native datetime picker
    window.cfOpenPicker = function(el) {
        try { if (el && typeof el.showPicker === 'function') el.showPicker() } catch (e) {}
    }

    function getDeliverables() {
        var chips = document.querySelectorAll('#deliverChips .cf-chip.on')
        var arr = []
        for (var i = 0; i < chips.length; i++) arr.push(chips[i].getAttribute('data-v'))
        return arr
    }

    window.doSubmitCrowdfunding = function() {
        var title = document.getElementById('title').value.trim()
        var personaName = document.getElementById('personaName').value.trim()
        var description = document.getElementById('description').value.trim()
        var tags = splitList(document.getElementById('tags').value)
        var style = document.getElementById('style').value
        var gender = document.getElementById('gender').value
        var ageRange = document.getElementById('ageRange').value
        var language = document.getElementById('language').value
        var personality = splitList(document.getElementById('personality').value)
        var voiceStyle = document.getElementById('voiceStyle').value
        var deliverables = getDeliverables()
        var adultChip = document.querySelector('#adultRow .cf-chip.on')
        var highlights = document.getElementById('highlights').value.trim()
        var referenceUrl = document.getElementById('referenceUrl').value.trim()
        var targetAmount = parseFloat(document.getElementById('targetAmount').value)
        var deadline = document.getElementById('deadline').value
        var coverUrl = document.getElementById('coverUrl').value

        if (!personaName) { showToast('Please enter a character name', 'warn'); return }
        if (!title) { showToast('Please enter a project title', 'warn'); return }
        if (description.length < 200) { showToast('Description must be at least 200 characters (currently ' + description.length + ')', 'warn'); return }
        if (!tags.length) { showToast('Please add at least one tag', 'warn'); return }
        if (tags.length > 10) { showToast('Up to 10 tags', 'warn'); return }
        if (!style) { showToast('Please choose a style', 'warn'); return }
        if (!deliverables.length) { showToast('Please select at least one deliverable', 'warn'); return }
        if (!adultChip) { showToast('Please select whether it is 18+ content', 'warn'); return }
        if (referenceUrl && !/^https?:\/\//i.test(referenceUrl)) { showToast('Reference link must start with http(s)://', 'warn'); return }
        if (!targetAmount || targetAmount <= 0) { showToast('Please enter a valid target amount', 'warn'); return }
        if (!deadline) { showToast('Please choose an end time', 'warn'); return }
        if (new Date(deadline).getTime() <= Date.now()) { showToast('End time must be in the future', 'warn'); return }

        var btn = document.getElementById('submitBtn')
        btn.disabled = true
        btn.textContent = 'Submitting...'

        fetch(base + '/crowdfunding/initiate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({
                title: title, persona_name: personaName, description: description,
                tags: tags.join(','), style: style, gender: gender, age_range: ageRange,
                language: language, personality: personality.join(','), voice_style: voiceStyle,
                deliverables: deliverables, is_adult: adultChip.getAttribute('data-v'),
                highlights: highlights, reference_url: referenceUrl, cover_url: coverUrl,
                target_amount: targetAmount, deadline: deadline
            })
        }).then(function(r){ return r.json() }).then(function(d){
            btn.disabled = false
            btn.textContent = 'Launch crowdfunding'
            if (d.code === '00000' || (d.data && d.data.id)) {
                showModal('\u2728', 'Crowdfunding launched!', 'Your character crowdfunding project is live. You can track it in My Projects.', 'View my projects', function(){
                    location.href = './my-crowdfunding.html'
                })
            } else {
                showToast(d.msg || 'Failed to launch', 'error')
            }
        }).catch(function(){
            btn.disabled = false
            btn.textContent = 'Launch crowdfunding'
            showToast('Network error, please try again later', 'error')
        })
    }
})()
