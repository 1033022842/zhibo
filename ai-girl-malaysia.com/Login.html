<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Login / Sign up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./assets/fy.css" data-turbo-track="reload">
  <script src="./Guys_files/application-347da9786350aca1e10ed8a86c72e8e5c2543b3b33ef23b6a298801855e0d811.js" data-turbo-track="reload" defer="defer"></script>
<script src="./Guys_files/alpine-ace55a5c3e128495b8997ce3059c8ff551594c2a047a2d2dc9d8bbf6df9d1139.js" data-turbo-track="reload" defer="defer"></script>
<script src="./Girls_files/jquery-3.6.0.min.js"></script>
<script src="./assets/layer/3.1.1/layer.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/event.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #18181b;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: flex;
      background: #232329;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,0.4);
      max-width: 900px;
      width: 100%;
    }
    .left-img {
      width: 400px;
      height: 600px;
      background: #222;
      flex-shrink: 0;
      background-image: url('./Girls_files/image1-510c9159fd51d7802ef2de3bc1e6edcbd5c5dc0a87ef225a5871143c46eaba02.webp');
      background-size: cover;
      background-position: center;
    }
    .form-area {
      flex: 1;
      padding: 48px 36px 24px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 340px;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      font-size: 24px;
      color: #fff;
      background: none;
      border: none;
      cursor: pointer;
    }
    .form-title {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 32px;
      letter-spacing: 1px;
    }
    .input-group {
      margin-bottom: 20px;
      position: relative;
    }
    .input-group input {
      width: 100%;
      padding: 14px 44px 14px 44px;
      border-radius: 8px;
      border: none;
      background: #18181b;
      color: #fff;
      font-size: 1rem;
      outline: none;
      box-sizing: border-box;
    }
    .input-group label {
      position: absolute;
      left: 44px;
      top: 14px;
      color: #aaa;
      font-size: 1rem;
      pointer-events: none;
      transition: 0.2s;
    }
    .input-group .icon {
      position: absolute;
      left: 14px;
      top: 14px;
      color: #aaa;
      font-size: 1.1rem;
    }
    .input-group .toggle-pw {
      position: absolute;
      right: 14px;
      top: 14px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .form-btn {
      width: 100%;
      padding: 14px 0;
      background: #f35b7a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .form-btn:hover {
      background: #e14a6a;
    }
    .switch-link {
      margin-top: 32px;
      text-align: center;
      color: #fff;
      font-size: 1rem;
    }
    .switch-link a {
      color: #f35b7a;
      text-decoration: none;
      margin-left: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .desc {
      color: #aaa;
      font-size: 0.95rem;
      margin-top: -12px;
      margin-bottom: 12px;
      margin-left: 4px;
    }
    @media (max-width: 800px) {
      .container { flex-direction: column; }
      .left-img { width: 100%; height: 220px; }
      .form-area { min-width: unset; padding: 32px 16px 16px 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-img"></div>
    <div class="form-area">
      <button class="close-btn" onclick="window.close()">&times;</button>
      <!-- 登录表单 -->
      <form id="loginForm">
        <div class="form-title">Sign in</div>
        <div class="input-group">
          <span class="icon">📧</span>
          <input type="email" required placeholder="E-mail" required="required" aria-required="true" placeholder="E-mail" type="email" value="" name="user[email]" id="user_email">
        </div>
        <div class="input-group">
          <span class="icon">🔒</span>
          <input type="password" required placeholder="Password" required="required" aria-required="true" placeholder="Password" type="password" name="user[password]" id="user_password">
          <button type="button" class="toggle-pw" onclick="togglePw('loginPassword', this)">👁️</button>
        </div>
        <button type="submit" class="form-btn" id="signin-btn">Sign in</button>
        <div class="switch-link">
          Don't have an account yet?
          <a onclick="showSignUp()">Sign up</a>
        </div>
      </form>
      <!-- 注册表单 -->
      <form id="signupForm" style="display:none;">
        <div class="form-title">Create Account</div>
        <div class="input-group">
          <span class="icon">👤</span>
          <input type="text" required placeholder="Username" required="required" aria-required="true" placeholder="Username" type="username" value="" name="user[username]" id="user_username_registration">
        </div>
        <div class="input-group">
          <span class="icon">📧</span>
          <input type="email" required placeholder="E-mail" id="user_email_registration" required="required" aria-required="true" placeholder="E-mail" type="email" name="user[email]">
        </div>
        <div class="input-group">
          <span class="icon">🔒</span>
          <input type="password" required minlength="6" placeholder="Password" id="user_password_registration" required="required" aria-required="true" placeholder="Password" type="password" name="user[password]">
          <button type="button" class="toggle-pw" onclick="togglePw('signupPassword', this)">👁️</button>
        </div>
        <div class="desc">Minimum 6 characters</div>
        <div class="input-group">
          <span class="icon">🆔</span>
          <input type="text" placeholder="invitation Code" id="user_code_registration" required="required" aria-required="true" placeholder="invitation Code" type="text" name="user[Invite_code]">
        </div>
        <div class="desc">Not required</div>
        <button type="submit" class="form-btn" id="signup-btn">Create Account</button>
        <div class="switch-link">
          Already have an account yet?
          <a onclick="showSignIn()">Sign in</a>
        </div>
      </form>
    </div>
  </div>
  <script>
    function showSignUp() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('signupForm').style.display = 'block';
    }
    function showSignIn() {
      document.getElementById('signupForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    }
    function togglePw(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }
    
  </script>
</body>
</html>
