    body {
      margin: 0;

      display: flex;

    }
    .container {
      display: flex;
      background: #232329;

      overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,0.4);

      width: 100%;
    }
    .left-img {
      width: 400px;

      background-position: center top;
    }
    .form-area {
      flex: 1;

    .close-btn {

    }
    .form-title {

      margin-bottom: 32px;
      letter-spacing: 1px;
    }
    .input-group {
      margin-bottom: 20px;
      position: relative;
    }
    .input-group input {
      width: 100%;
      padding: 14px 44px 14px 44px;
      border-radius: 8px;
      border: none;
      background: #18181b;
      color: #fff;
      font-size: 1rem;
      outline: none;
      box-sizing: border-box;
    }
    .input-group label {
      position: absolute;
      left: 44px;
      top: 14px;
      color: #aaa;
      font-size: 1rem;
      pointer-events: none;
      transition: 0.2s;
    }
    .input-group .icon {
      position: absolute;
      left: 14px;
      top: 14px;
      color: #aaa;
      font-size: 1.1rem;
    }
    .input-group .toggle-pw {
      position: absolute;
      right: 14px;
      top: 14px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .form-btn {
      width: 100%;
      padding: 14px 0;
      background: #f35b7a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .form-btn:hover {
      background: #e14a6a;
    }
    .switch-link {
      margin-top: 32px;
      text-align: center;
      color: #fff;
      font-size: 1rem;
    }
    .switch-link a {
      color: #f35b7a;
      text-decoration: none;
      margin-left: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .desc {
      color: #aaa;
      font-size: 0.95rem;
      margin-top: -12px;
      margin-bottom: 12px;
      margin-left: 4px;
    }
    .skip-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 0.9rem;
      text-decoration: none;
      transition: color 0.2s;

    /* 登录页手机端不显示底部导航与右下角客服球（会挡住「登录」按钮） */
    @media (max-width:1023px){
      .fy-bnav{display:none!important}

<body>
  <div class="container">
    <div class="left-img"></div>
    <div class="form-area">
      <button class="close-btn" onclick="closeLoginPage()">&times;</button>
      <!-- 登录表单 -->
      <form id="loginForm">
        <div class="form-title">Sign in</div>
        <div class="input-group">
          <span class="icon">📧</span>
          <input type="email" required placeholder="E-mail" required="required" aria-required="true" placeholder="E-mail" type="email" value="" name="user[email]" id="user_email">
        </div>
        <div class="input-group">
          <span class="icon">🔒</span>
          <input type="password" required placeholder="Password" required="required" aria-required="true" placeholder="Password" type="password" name="user[password]" id="user_password">
          <button type="button" class="toggle-pw" onclick="togglePw('user_password', this)">👁️</button>
        </div>
        <button type="submit" class="form-btn" id="signin-btn">Sign in</button>
        <div class="switch-link">
          Don't have an account yet?
          <a onclick="showSignUp()">Sign up</a>
        </div>
        <a href="./Girls.html" class="skip-link">Skip &amp; Browse as Guest</a>
      </form>
      <!-- 注册表单 -->
      <form id="signupForm" style="display:none;">
        <div class="form-title">Create Account</div>
        <div class="input-group">
          <span class="icon">👤</span>
          <input type="text" required placeholder="Username" required="required" aria-required="true" placeholder="Username" type="username" value="" name="user[username]" id="user_username_registration">
        </div>
        <div class="input-group">
          <span class="icon">📧</span>
          <input type="email" required placeholder="E-mail" id="user_email_registration" required="required" aria-required="true" placeholder="E-mail" type="email" name="user[email]">
        </div>
        <div class="input-group">
          <span class="icon">🔒</span>
          <input type="password" required minlength="6" placeholder="Password" id="user_password_registration" required="required" aria-required="true" placeholder="Password" type="password" name="user[password]">
          <button type="button" class="toggle-pw" onclick="togglePw('user_password_registration', this)">👁️</button>
        </div>
        <div class="desc">Minimum 6 characters</div>
        <div class="input-group">
          <span class="icon">🆔</span>
          <input type="text" placeholder="invitation Code" id="user_code_registration" required="required" aria-required="true" placeholder="invitation Code" type="text" name="user[Invite_code]">
        </div>
        <div class="desc">Not required</div>
        <button type="submit" class="form-btn" id="signup-btn">Create Account</button>
        <div class="switch-link">
          Already have an account yet?
          <a onclick="showSignIn()">Sign in</a>
        </div>
        <a href="./Girls.html" class="skip-link">Skip &amp; Browse as Guest</a>
      </form>
    </div>
  </div>
  <script>
    function showSignUp() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('signupForm').style.display = 'block';
    }
    function showSignIn() {
      document.getElementById('signupForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    }
    function togglePw(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }
    // × ：退回进入登录页之前的那个页面（?redirect= 优先，其次来源页，兜底 Home.html）
    function closeLoginPage() {
      var target = (typeof window.liveBackFromLogin === 'function') ? window.liveBackFromLogin() : './Home.html';
      window.location.replace(target);
    }
  </script>
