# 仓库模板：部署时把 __MEDIA_SIGN_SECRET__ / __MEDIA_GATEWAY_KEY__ 换成实际值
# ============================================================
# 媒体源站 / 对象存储网关
#   /pub/  → 公开资源（仅图片，CDN 长缓存）
#   /sec/  → 私有资源（nginx secure_link 签名校验）
#   /s3/   → S3 写网关（项目机带 X-Media-Key，反代到本机 MinIO）
#   /sugus-media/ → 运维备份通道（仅项目机 IP）
#   MinIO 9000 仅监听 127.0.0.1，外部无法绕过本层
#
# 依赖（必须写在 nginx.conf 的 http 块，不能放本文件）：
#     map_hash_bucket_size 128;
#     map_hash_max_size 4096;
#
# 依赖文件：
#     /etc/nginx/bunny_realip.conf                 Bunny 边缘 IP（update_bunny_realip.sh 每月刷新）
#     /etc/nginx/snippets/media_origin_allow.conf  源站白名单（lock/unlock_media_origin.sh 切换）
#     /mnt/storage/etc/minio.env                   MEDIA_GATEWAY_KEY 的值来源
# ============================================================

# 转发给 MinIO 的原始编码路径（$uri 是解码后的，含空格会让 MinIO 400）
map $request_uri $req_path_enc {
    ~^([^?]*)  $1;
}

upstream minio_backend {
    server 127.0.0.1:9000;
    keepalive 16;
}

map $http_x_media_key $media_gateway_pass {
    default                 0;
    "__MEDIA_GATEWAY_KEY__" 1;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/155-103-194-69.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/155-103-194-69.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2048m;
    server_tokens off;

    # Bunny 回源：还原访客真实 IP（边缘 IP 清单由 update_bunny_realip.sh 定期刷新）
    include /etc/nginx/bunny_realip.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ---------- 私有资源：签名校验 ----------
    location ^~ /sec/ {
        # 源站访问控制（默认 allow all；接 Bunny 后改成只允许边缘 IP + 项目机）
        include /etc/nginx/snippets/media_origin_allow.conf;

        secure_link $arg_s,$arg_e;
        secure_link_md5 "$secure_link_expires$uri __MEDIA_SIGN_SECRET__";

        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }

        proxy_pass http://minio_backend/sugus-media$req_path_enc;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Vary;

        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes always;
    }

    # ---------- 公开资源 ----------
    location ^~ /pub/ {
        include /etc/nginx/snippets/media_origin_allow.conf;

        proxy_pass http://minio_backend/sugus-media$req_path_enc;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Vary;

        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes always;
    }

    # ---------- S3 写网关（项目机中转转存） ----------
    location ^~ /s3/ {
        if ($media_gateway_pass = 0) { return 403; }

        proxy_pass http://minio_backend/sugus-media/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Amz-Content-Sha256 $http_x_amz_content_sha256;
        proxy_set_header X-Amz-Date $http_x_amz_date;
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_buffer_size 1m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------- ACME 证书校验 ----------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ---------- 运维备份通道（仅项目机 172 可访问，供 mc 全量镜像） ----------
    location ^~ /sugus-media/ {
        allow 172.81.98.55;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://minio_backend/sugus-media/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / { return 404; }
}
