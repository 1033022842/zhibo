# ============================================================
# 存储服务器（155.103.194.69）nginx 配置
#   部署位置：/etc/nginx/sites-available/media  →  /etc/nginx/sites-enabled/media
#   依赖：nginx.conf 的 http 块里有 map_hash_bucket_size 128; map_hash_max_size 4096;
#   （map 太大会报 "could not build map_hash"，这两个值必须放在 http 块，不能放 server 文件）
#
#   /pub/  → 公开资源（仅图片，CDN 长缓存）
#   /sec/  → 私有资源（secure_link 签名校验）
#   /s3/   → S3 写网关（项目机带 X-Media-Key，反代到本机 MinIO）
#   /sugus-media/ → 运维备份通道（仅项目机 IP）
#   MinIO 9000 只监听 127.0.0.1，公网无法绕过本层
# ============================================================

# 转发给 MinIO 的原始编码路径（$uri 是解码后的，路径含空格会让 MinIO 返回 400）
map $request_uri $req_path_enc {
    ~^([^?]*)  $1;
}

upstream minio_backend {
    server 127.0.0.1:9000;
    keepalive 16;
}

# 写网关口令：项目机 PHP 请求头 X-Media-Key（值见 /mnt/storage/etc/minio.env MEDIA_GATEWAY_KEY）
map $http_x_media_key $media_gateway_pass {
    default                 0;
    "__MEDIA_GATEWAY_KEY__" 1;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/155-103-194-69.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/155-103-194-69.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2048m;
    server_tokens off;

    # ---------- 私有资源：签名校验 ----------
    # 签名口径：base64url(md5("$exp$uri $SECRET"))，与 PHP Media::sign() 一致
    location ^~ /sec/ {
        secure_link $arg_s,$arg_e;
        secure_link_md5 "$secure_link_expires$uri __MEDIA_SIGN_SECRET__";

        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }

        proxy_pass http://minio_backend/sugus-media$req_path_enc;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        add_header Cache-Control "private, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes always;
    }

    # ---------- 公开资源（只有图片会写到这里） ----------
    location ^~ /pub/ {
        proxy_pass http://minio_backend/sugus-media$req_path_enc;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        add_header Cache-Control "public, max-age=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes always;
    }

    # ---------- S3 写网关（项目机中转转存） ----------
    location ^~ /s3/ {
        if ($media_gateway_pass = 0) { return 403; }

        proxy_pass http://minio_backend/sugus-media/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Amz-Content-Sha256 $http_x_amz_content_sha256;
        proxy_set_header X-Amz-Date $http_x_amz_date;
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_buffer_size 1m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------- ACME 证书校验 ----------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ---------- 运维备份通道（仅项目机 172 可访问，供 mc 全量镜像） ----------
    location ^~ /sugus-media/ {
        allow 172.81.98.55;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://minio_backend/sugus-media/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / { return 404; }
}
