# ==== 中国大陆访问屏蔽（v2：geo 名单，IPv4+IPv6）====
# 2026-10-25：旧版 geoip2 + chnroutes.mmdb 只有 v4 数据，访客走 IPv6
# （手机蜂窝网）经 X-Forwarded-For 还原出 v6 地址后查不到 → 判不出 CN → 绕过。
# 现改用 APNIC delegated 数据生成的 geo 名单（v4+v6 全覆盖），
# 数据由 /root/deploy/update_cn_block.sh 月度刷新（cron 0 4 1 * *）。
include /etc/nginx/bunny_realip.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# CN v4+v6 段 → 1
geo $remote_addr $cn_geo {
    default 0;
    include /etc/nginx/cn_geo.conf;
}

# 后台豁免：运营在国内，/admin* 不拦（8081 后台口与 sugus.it.com 本就不在封锁面）
map $uri $cn_admin {
    ~^/admin  1;
    default   0;
}

# $is_cn = CN 访客（既有 server 块引用同名变量，语义不变）
map $cn_geo $is_cn {
    1       1;
    default 0;
}
