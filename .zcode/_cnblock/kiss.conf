# /ai 静态站缓存策略：HTML 短缓存（部署即时生效），静态资源长缓存（Bunny 边缘命中）
map $uri $ai_cache {
    default                              'public, max-age=60, stale-while-revalidate=300';
    ~*\.(js|css)$                        'public, max-age=2592000, immutable';
    ~*\.(png|jpg|jpeg|webp|gif|svg|ico)$ 'public, max-age=604800';
    ~*\.(woff2?|ttf|eot|mp3)$            'public, max-age=2592000';
}

server {
    include /etc/nginx/snippets/cn-block-site.conf;
    server_name kisss.ai www.kisss.ai _;
    absolute_redirect off;

    root /www/wwwroot/douyin/vue/dist;
    index index.html;
    client_max_body_size 512m;

    access_log /var/log/nginx/kiss.access.log;
    error_log  /var/log/nginx/kiss.error.log;

    location = / { return 302 /ai/Home.html$is_args$args; }
    # Vue SPA（直播首页 /home、房间页 /room/:id 等）
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control 'no-cache'; }

    # open_file_cache 会缓存 fd：SRS 用 rename 换 inode，导致 m3u8 最长 60s 不变 → 播放器请求已删除的 ts 段 → 404 卡顿
    location ~ ^/hls/(?<hls_path>.+\.m3u8)$ { open_file_cache off; alias /data/hls/$hls_path; add_header Access-Control-Allow-Origin *; add_header Cache-Control 'no-cache'; types { application/vnd.apple.mpegurl m3u8; } }
    location ~ ^/hls/(?<hls_path>.+\.ts)$ { open_file_cache off; alias /data/hls/$hls_path; add_header Access-Control-Allow-Origin *; add_header Cache-Control 'public, max-age=86400'; types { video/mp2t ts; } }

    location ~* \.(js|css)$ { add_header Cache-Control 'public, max-age=3600'; }

    location ^~ /admin/assets/ { alias /www/wwwroot/douyin/admin/dist/assets/; expires 12h; }
    location /admin/ { alias /www/wwwroot/douyin/admin/dist/; index index.html; try_files $uri $uri/ @kiss_admin_api; }
    location @kiss_admin_api {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/douyin/php/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
    }

    # userInfo 精确匹配 + 限流（见文件顶部 limit_req_zone 注释）
    location = /api/live/userInfo {
        limit_req zone=userinfo burst=15 nodelay;
        limit_req_status 429;
        root /www/wwwroot/douyin/php/public;
        try_files $uri /index.php$uri$is_args$args;
    }

    location /api/ { root /www/wwwroot/douyin/php/public; try_files $uri /index.php$uri$is_args$args; }
    location ~ \.php(/|$) {
        root /www/wwwroot/douyin/php/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/douyin/php/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # 素材已迁到独立存储：主站不再直读本地（全部走签名 URL）
    location ^~ /storage/ { return 403; }
    location ^~ /ai/ { alias /www/wwwroot/douyin/ai-girl-malaysia.com/; index Login.html index.html; add_header Cache-Control $ai_cache; }

    location ~* (\.user\.ini|\.htaccess|\.env$|\.git|composer\.(json|lock)) { deny all; }

    include /etc/nginx/snippets/cn-block-site.conf;
    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kisss.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kisss.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# kisss.si：后台专用入口（只暴露 /admin/ 与后台所需 API，其余跳回主站）
server {
    server_name kisss.si;
    absolute_redirect off;

    root /www/wwwroot/douyin/vue/dist;
    index index.html;
    client_max_body_size 512m;

    access_log /var/log/nginx/kiss.admin.access.log;
    error_log  /var/log/nginx/kiss.admin.error.log;

    location = / { return 302 /admin/; }

    location ^~ /admin/assets/ { alias /www/wwwroot/douyin/admin/dist/assets/; expires 12h; }
    location /admin/ { alias /www/wwwroot/douyin/admin/dist/; index index.html; try_files $uri $uri/ @kiss_admin_api; }
    location @kiss_admin_api {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/douyin/php/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
    }

    location /api/ { root /www/wwwroot/douyin/php/public; try_files $uri /index.php$uri$is_args$args; }
    location ~ \.php(/|$) {
        root /www/wwwroot/douyin/php/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/douyin/php/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # 前台页面 / 静态站统一跳回主站
    location / { return 302 https://kisss.ai$request_uri; }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/kisss.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kisss.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    include /etc/nginx/snippets/cn-block-full.conf;
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kisss.ai www.kisss.ai kisss.si _;

    # HLS 明文回源口：给 Bunny kisss-live zone 用（避开 IP+SNI 证书问题）
    location ~ ^/hls/(?<hls_path>.+\.(m3u8|ts))$ {
        open_file_cache off;
        alias /data/hls/$hls_path;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache";
        types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
    }

    location / {
        if ($host = kisss.si) { return 301 https://$host$request_uri; }
        if ($host = www.kisss.ai) { return 301 https://$host$request_uri; } # managed by Certbot
        if ($host = kisss.ai) { return 301 https://$host$request_uri; } # managed by Certbot
        return 404; # managed by Certbot
    }
}include /etc/nginx/snippets/internal80.conf;
