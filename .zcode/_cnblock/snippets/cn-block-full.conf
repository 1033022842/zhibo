# 中国大陆屏蔽（挂到 server 块；无后台豁免——CDN 回源口/HLS 口用）
error_page 403 @cn_blocked;
if ($is_cn) {
    return 403;
}
location @cn_blocked {
    add_header Cache-Control "no-store" always;
    default_type text/html;
    return 403 "<html><body style=background:#0d0a0f;color:#a4a4a4;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh><h2>403 · Service not available in your region.</h2></body></html>";
}
