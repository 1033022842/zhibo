# CDN 专用回源口（8081）：只暴露 /ai/ 静态 + /hls/ + /api/ + /ws/
# 供 Bunny Pull Zone 回源；/admin/ 与 /storage/ 一律 404
server {
    include /etc/nginx/snippets/cn-block-full.conf;
    listen 8081;
    server_name _;

    root /www/wwwroot/douyin/vue/dist;
    index index.html;
    client_max_body_size 64m;

    access_log /var/log/nginx/kelymi.cdn.access.log;
    error_log  /var/log/nginx/kelymi.cdn.error.log;

    location = / { return 302 /ai/Home.html$is_args$args; }

    location ^~ /ai/ {
        alias /www/wwwroot/douyin/ai-girl-malaysia.com/;
        index Login.html index.html;
        add_header Cache-Control $ai_cache;
    }

    location ~ ^/hls/(?<hls_path>.+\.m3u8)$ { open_file_cache off; alias /data/hls/$hls_path; add_header Access-Control-Allow-Origin *; add_header Cache-Control "no-cache"; types { application/vnd.apple.mpegurl m3u8; } }
    location ~ ^/hls/(?<hls_path>.+\.ts)$   { open_file_cache off; alias /data/hls/$hls_path; add_header Access-Control-Allow-Origin *; add_header Cache-Control "public, max-age=86400"; types { video/mp2t ts; } }

    location /api/ {
        root /www/wwwroot/douyin/php/public;
        try_files $uri /index.php$uri$is_args$args;
    }

    location ~ \.php(/|$) {
        root /www/wwwroot/douyin/php/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/douyin/php/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location ^~ /storage/ { return 404; }
    location ^~ /admin/   { return 404; }

    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
