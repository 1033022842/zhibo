    location @admin_api {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/douyin/php/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
