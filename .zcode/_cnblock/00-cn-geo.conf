# ==== 中国大陆访问屏蔽：判定层（geo 名单，IPv4+IPv6）====
# 2026-10-25：旧 sugus 方案用 chnroutes.mmdb（只有 v4 数据），访客走 IPv6
# （手机蜂窝网默认 v6 优先）时经 X-Forwarded-For 还原出 v6 地址后查不到 →
# 判不出 CN → 封锁被绕过。改用 APNIC delegated 数据生成的 geo 名单（v4+v6 全覆盖）。
# 数据由 /root/deploy/update_cn_block.sh 月度刷新（cron 0 4 1 * *）。
# realip（Bunny 边缘还原真实 IP）由 00-bunny-realip.conf 负责，本文件不重复声明。

# CN v4+v6 段 → 1
geo $remote_addr $cn_geo {
    default 0;
    include /etc/nginx/cn_geo.conf;
}

# 后台豁免：运营在国内，/admin* 不拦（后台自身有 IP 白名单 + 2FA 兜底）
map $uri $cn_admin {
    ~^/admin  1;
    default   0;
}

# $is_cn      = CN 访客（CDN 回源口等无后台的 server 用）
# $is_cn_site = CN 访客且非 /admin（后台挂在主域名下的站用）
map $cn_geo $is_cn {
    1       1;
    default 0;
}
map "$is_cn$cn_admin" $is_cn_site {
    "10"    1;
    default 0;
}
